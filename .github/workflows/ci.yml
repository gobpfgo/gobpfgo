name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Check C formatting
        run: |
          if ! command -v clang-format >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y clang-format
          fi
          make format-check

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Build without cgo
        run: CGO_ENABLED=0 go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test without cgo
        run: CGO_ENABLED=0 go test ./...

      - name: Check no unsafe imports
        run: |
          if go list -f '{{.ImportPath}} {{join .Imports " "}}' ./... | grep -E ' unsafe( |$)'; then
            echo "unsafe import is forbidden" >&2
            exit 1
          fi

      - name: Check license headers
        run: |
          missing=0
          while IFS= read -r f; do
            if ! head -5 "$f" | grep -q 'SPDX-License-Identifier: LGPL-2.1-only'; then
              echo "missing SPDX header: $f"
              missing=1
            fi
          done < <(git ls-files '*.go' '*.c' '*.h')
          exit "$missing"
